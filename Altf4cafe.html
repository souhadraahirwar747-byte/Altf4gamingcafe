        #splashScreen {

            top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle at center, #111a33 0%, #050811 100%);
            z-index: 100000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease, transform 0.5s ease;

        .splash-core {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;

        .splash-ring {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px dashed var(--primary);
            animation: spin 8s linear infinite;

        .splash-ring-pink {
            position: absolute;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 1px dashed var(--neon-pink);
            animation: spinRev 6s linear infinite;

        @keyframes spinRev { 100% { transform: rotate(-360deg); } }
